name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach binaries to
        required: true
        default: v0.0.1

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset: xkeen-sub-aarch64
            toolchain: stable
            rust_targets: aarch64-unknown-linux-musl
            components: ""
          - target: mipsel-unknown-linux-musl
            asset: xkeen-sub-mipsel
            toolchain: nightly
            rust_targets: ""
            components: rust-src
          - target: mips-unknown-linux-musl
            asset: xkeen-sub-mips
            toolchain: nightly
            rust_targets: ""
            components: rust-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@${{ matrix.toolchain }}
        with:
          targets: ${{ matrix.rust_targets }}
          components: ${{ matrix.components }}

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross +${{ matrix.toolchain }} build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        run: cp target/${{ matrix.target }}/release/xkeen-sub ${{ matrix.asset }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all architecture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: xkeen-sub-*
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/xkeen-sub-*
          generate_release_notes: ${{ github.event_name == 'push' }}
