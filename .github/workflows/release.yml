name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag to attach binaries to
        required: true
        default: v0.0.2

permissions:
  contents: write

jobs:
  test:
    name: Run Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset: xkeen-sub-aarch64
            toolchain: stable
            rust_targets: aarch64-unknown-linux-musl
          - target: mipsel-unknown-linux-musl
            asset: xkeen-sub-mipsel
            toolchain: nightly
          - target: mips-unknown-linux-musl
            asset: xkeen-sub-mips
            toolchain: nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        if: matrix.toolchain == 'stable'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install nightly Rust
        if: matrix.toolchain == 'nightly'
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cross
        run: cargo install cross --locked

      - name: Build
        run: cross +${{ matrix.toolchain }} build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        run: cp target/${{ matrix.target }}/release/xkeen-sub ${{ matrix.asset }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all architecture binaries
        uses: actions/download-artifact@v4
        with:
          pattern: xkeen-sub-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/xkeen-sub-*
          overwrite_files: true
          generate_release_notes: ${{ github.event_name == 'push' }}
