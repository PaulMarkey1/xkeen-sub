[package]
name = "xkeen-sub"
version = "0.0.2"
edition = "2021"
description = "CLI utility for managing XKeen subscriptions on Keenetic"

[[bin]]
name = "xkeen-sub"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json5 = "0.4"
url = "2"
base64 = "0.22"
